<!doctype html><html><body style="margin:0;background:#8a96a3">
<canvas id="g" width="1600" height="800"></canvas>
<script src="node_modules/three/build/three.min.js"></script>
<script src="jacket3d.js"></script>
<script>
const logo=new Image();logo.src="logo_alpeo_A_blanc.png";
window.shot=(yaws,pitch=0)=>{
  const R=new THREE.WebGLRenderer({canvas:document.getElementById('g'),antialias:true,alpha:true,preserveDrawingBuffer:true});
  R.outputEncoding=THREE.sRGBEncoding;R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.0;
  R.setScissorTest(true);
  const S=new THREE.Scene();setupLights(S,R);const J=buildJacket(logo);S.add(J);
  const C=new THREE.PerspectiveCamera(30,400/800,.1,100);C.position.set(0,0,4.2);
  yaws.forEach((y,i)=>{J.rotation.set(pitch,y,0);R.setViewport(i*400,0,400,800);R.setScissor(i*400,0,400,800);R.setClearColor(0x8a96a3,1);R.clear();R.render(S,C);});
};
window.ready=new Promise(r=>logo.onload=r);
</script></body></html>
