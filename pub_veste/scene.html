<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"Disp";src:url("file:///usr/share/fonts/opentype/inter/InterDisplay-BlackItalic.otf");font-weight:900;font-style:italic}
@font-face{font-family:"Txt";src:url("file:///usr/share/fonts/opentype/inter/InterDisplay-SemiBold.otf");font-weight:600}
@font-face{font-family:"Txt";src:url("file:///usr/share/fonts/opentype/inter/InterDisplay-Medium.otf");font-weight:500}
html,body{margin:0;background:#000}canvas{display:block}
</style></head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// ====== À PERSONNALISER ======
const CONFIG = {
  product: "ALTITUDE 500",
  site: "votresite.fr",
  logo: "logo_alpeo_blanc.png",
  logoA: "logo_alpeo_A_blanc.png",
  photos: { dos: "photo_dos.jpg", face: "photo_face.jpg", detail: "photo_detail.jpg", fond: "fond_prairie.jpg", sommets: "fond_sommets.jpg" },
  credits: "Photos de fond : Kritzolina, Maryliflower – CC BY-SA 4.0 via Wikimedia Commons",
  vestes: { face: "photo_face_veste.png", dos: "photo_dos_veste.png" },
  atouts: ["COUPE-VENT", "RESPIRANTE", "COUTURES ÉTANCHES"],
};
// =============================
const W=1920,H=1080,T=23;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const ORANGE="#ff7a1a",BLUE="#0b5fc4";
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,k)=>a+(b-a)*k;
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const eOut=k=>1-Math.pow(1-k,3);
const eInOut=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
function rng(seed){return()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}}
const load=s=>{const i=new Image();i.src=s;return i};
const P={dos:load(CONFIG.photos.dos),face:load(CONFIG.photos.face),detail:load(CONFIG.photos.detail),fond:load(CONFIG.photos.fond),sommets:load(CONFIG.photos.sommets)};
const V={face:load(CONFIG.vestes.face),dos:load(CONFIG.vestes.dos)};
// flottement : descente depuis le ciel puis balancement (comme la pub de référence)
function floatJacket(img,x,y,h,t,t0,alpha=1,seed=0){
  if(alpha<=0||t<t0)return;
  const e=prog(t,t0,t0+1.8);
  const drop=(1-(1-Math.pow(1-e,3)*(1+.0)))*0; // placeholder
  const k=eOut(e), over=Math.sin(e*Math.PI)*.04;
  let yy=y-(1-k)*(H*.9)+over*h*.3;
  const tt=t+seed;
  yy+=Math.sin(tt*2*Math.PI/3.4)*h*.022;
  const rot=(1-k)*-.10+Math.sin(tt*2*Math.PI/4.6+.6)*.045;
  const yaw=Math.sin(tt*2*Math.PI/5.8+1.1);
  const sx=1-.07*(1-Math.cos(tt*2*Math.PI/5.8+1.1))/2, sk=yaw*.035;
  const w=h*img.width/img.height;
  ctx.save();ctx.globalAlpha=alpha;
  ctx.translate(x+Math.sin(tt*2*Math.PI/7)*h*.015,yy);
  ctx.rotate(rot);ctx.transform(sx,sk,0,1,0,0);
  ctx.shadowColor="rgba(0,10,30,.45)";ctx.shadowBlur=h*.08;ctx.shadowOffsetY=h*.05;
  ctx.drawImage(img,-w/2,-h/2,w,h);
  ctx.restore();
}
const logo=load(CONFIG.logo),logoA=load(CONFIG.logoA);

// photo "cover" with zoom and focus point (cx,cy normalized in image), inside region rx..rx+rw
function photo(img,zoom,cx,cy,alpha=1,rx=0,rw=W){
  if(alpha<=0)return;
  const s=Math.max(rw/img.width,H/img.height)*zoom, iw=img.width*s, ih=img.height*s;
  const hx=rw/2/iw, hy=H/2/ih;
  cx=clamp(cx,hx,1-hx); cy=clamp(cy,hy,1-hy);
  ctx.save();ctx.globalAlpha=alpha;
  ctx.beginPath();ctx.rect(rx,0,rw,H);ctx.clip();
  ctx.drawImage(img,rx+rw/2-cx*iw,H/2-cy*ih,iw,ih);
  ctx.restore();
}
function shadeLeft(a,w=1100){
  if(a<=0)return;
  const g=ctx.createLinearGradient(0,0,w,0);
  g.addColorStop(0,`rgba(4,12,26,${.72*a})`);g.addColorStop(.6,`rgba(4,12,26,${.3*a})`);g.addColorStop(1,"rgba(4,12,26,0)");
  ctx.fillStyle=g;ctx.fillRect(0,0,w,H);
}
function shadeBottom(a){
  if(a<=0)return;
  const g=ctx.createLinearGradient(0,H*.45,0,H);
  g.addColorStop(0,"rgba(4,12,26,0)");g.addColorStop(1,`rgba(4,12,26,${.75*a})`);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}

// ---------- text ----------
function txt(s,x,y,size,k,opt={}){
  if(k<=0)return;
  const {align="left",color="#fff",weight=900,family="Disp",style="italic",shadow=true,out=1,maxW=0}=opt;
  if(out<=0)return;
  ctx.save();
  ctx.font=`${style} ${weight} ${size}px ${family}`;
  if(maxW&&ctx.measureText(s).width>maxW){size*=maxW/ctx.measureText(s).width;ctx.font=`${style} ${weight} ${size}px ${family}`}
  ctx.textAlign=align;
  const w=ctx.measureText(s).width, lx=align==="left"?x:align==="right"?x-w:x-w/2;
  ctx.beginPath();ctx.rect(lx-40,y-size*1.05,w+80,size*1.35);ctx.clip();
  ctx.globalAlpha=out;
  if(shadow){ctx.shadowColor="rgba(0,10,30,.55)";ctx.shadowBlur=28;ctx.shadowOffsetY=6}
  ctx.fillStyle=color;ctx.fillText(s,x,y+(1-eOut(k))*size*1.2);
  ctx.restore();
}
function tag(s,x,y,size,k,bg=ORANGE,fg="#fff",out=1){
  if(k<=0||out<=0)return;
  ctx.save();ctx.globalAlpha=out;ctx.font=`italic 900 ${size}px Disp`;
  const w=ctx.measureText(s).width+size*1.1,h=size*1.55,e=eOut(k);
  ctx.beginPath();ctx.rect(x-20,y-20,(w+40)*e,h+40);ctx.clip();
  ctx.fillStyle=bg;ctx.beginPath();ctx.moveTo(x+h*.25,y);ctx.lineTo(x+w,y);ctx.lineTo(x+w-h*.25,y+h);ctx.lineTo(x,y+h);ctx.closePath();ctx.fill();
  ctx.fillStyle=fg;ctx.textBaseline="middle";ctx.fillText(s,x+size*.55,y+h*.53);
  ctx.restore();
  return w;
}

// ---------- particles ----------
const flakes=[];{const r=rng(99);for(let i=0;i<220;i++)flakes.push({x:r()*W,y:r()*H,z:.3+r()*1.2,p:r()*6.28})}
function snow(t,wind,a=1){
  ctx.fillStyle="#fff";
  for(const f of flakes){
    const x=((f.x-(50+wind*1000)*f.z*t+Math.sin(t*1.3+f.p)*20)%W+W)%W, y=((f.y+60*f.z*t)%H+H)%H;
    ctx.globalAlpha=a*(.25+.45*f.z/1.5);
    if(wind>.2)ctx.fillRect(x,y,4+wind*40*f.z,1.6*f.z);
    else{ctx.beginPath();ctx.arc(x,y,1.3*f.z+.3,0,6.283);ctx.fill()}
  }
  ctx.globalAlpha=1;
}
function streaks(t,a){
  if(a<=0)return;
  const r=rng(7);ctx.strokeStyle="#fff";ctx.lineCap="round";
  for(let i=0;i<26;i++){
    const y=r()*H,len=200+r()*500,sp=2500+r()*2000,x=W+300-((t*sp+r()*4000)%(W+1400));
    ctx.globalAlpha=a*(.12+r()*.3);ctx.lineWidth=1+r()*2.5;
    ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+len,y-len*.06);ctx.stroke();
  }
  ctx.globalAlpha=1;
}

// ---------- end card ----------
function endCard(t){
  const k=eInOut(prog(t,18.9,19.6));
  if(k<=0)return;
  const x0=lerp(W+200,W*.6,k);
  ctx.save();
  ctx.fillStyle=BLUE;ctx.beginPath();ctx.moveTo(x0,0);ctx.lineTo(W+10,0);ctx.lineTo(W+10,H);ctx.lineTo(x0-180,H);ctx.closePath();ctx.fill();
  ctx.fillStyle=ORANGE;ctx.beginPath();ctx.moveTo(x0-12,0);ctx.lineTo(x0+6,0);ctx.lineTo(x0-174,H);ctx.lineTo(x0-192,H);ctx.closePath();ctx.fill();
  ctx.restore();
  const bx=W*.6+10, lk=eOut(prog(t,19.6,20.3));
  if(lk>0){const lw=620,lh=lw*logo.height/logo.width;
    ctx.save();ctx.globalAlpha=lk;ctx.translate(bx,230+(1-lk)*40);const sc=lerp(.92,1,lk);ctx.scale(sc,sc);
    ctx.drawImage(logo,0,0,lw,lh);ctx.restore()}
  ctx.save();ctx.fillStyle=ORANGE;ctx.fillRect(bx,500,lerp(0,500,eOut(prog(t,19.9,20.5))),8);ctx.restore();
  txt("VESTE "+CONFIG.product,bx,595,54,prog(t,20.1,20.7),{shadow:false,maxW:W-bx-80});
  txt("En magasin et sur "+CONFIG.site,bx,660,36,prog(t,20.4,21),{weight:500,family:"Txt",style:"normal",shadow:false,color:"#dbe9ff"});
  tag("JE DÉCOUVRE  →",bx,720,40,prog(t,20.8,21.4),"#fff",BLUE);
  txt(CONFIG.credits,W-40,H-30,17,prog(t,20.5,21),{align:"right",weight:500,family:"Txt",style:"normal",shadow:false,color:"rgba(220,233,255,.75)"});
}

// ---------- main ----------
function render(t){
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;
  ctx.fillStyle="#000";ctx.fillRect(0,0,W,H);

  // A 0-5 : fond nuages, la veste (dos) descend du ciel
  if(t<5.2){const k=prog(t,0,5.2);
    photo(P.fond,lerp(1.48,1.58,eInOut(k)),.42,.29);
    shadeLeft(1,1150);
    floatJacket(V.dos,1330,560,700,t,.4,1,0);}
  // B 5-10 : la veste de face flotte, se balance
  if(t>=5&&t<10.3){const k=prog(t,5,10.3);
    const a=prog(t,5,5.15)*(1-prog(t,10,10.3));
    photo(P.fond,lerp(1.7,1.6,k),.6,.27,a);
    shadeLeft(prog(t,5.3,6),1000);
    floatJacket(V.face,1300,560,880,t,5.05,a,2);}
  // C 10-16 : détail déperlant
  if(t>=10&&t<16.3){const k=prog(t,10,16.3);
    photo(P.detail,lerp(1.0,1.45,eInOut(k)),lerp(.5,.6,eInOut(k)),lerp(.5,.66,eInOut(k)),prog(t,10,10.3)*(1-prog(t,16,16.3)));
    shadeLeft(.8*prog(t,10.3,11)*(1-prog(t,16,16.3)),1000);}
  // D 16-19 : dos, au-dessus des nuages
  if(t>=16&&t<19.7){const k=prog(t,16,19.7);
    photo(P.sommets,lerp(1.3,1.1,eOut(k)),.55,.45,prog(t,16,16.3));
    shadeLeft(1-prog(t,18.8,19.3),1150);
    floatJacket(V.dos,1360,560,760,t,15.6,prog(t,16,16.3)*(1-prog(t,18.9,19.4)),5);}
  // E 19-23 : la veste de face flotte à gauche + carton final
  if(t>=18.9){const rw=lerp(W,W*.62,eInOut(prog(t,18.9,19.6))),a=prog(t,18.9,19.4);
    photo(P.fond,lerp(1.8,1.86,prog(t,18.9,23)),.62,.28,a,0,rw);
    ctx.save();ctx.beginPath();ctx.rect(0,0,rw,H);ctx.clip();
    floatJacket(V.face,rw/2+20,560,820,t,18.9,a,8);ctx.restore();}

  const wind=Math.max(prog(t,4.6,5.1)*(1-prog(t,5.6,6.6)),prog(t,9.7,10)*(1-prog(t,10.2,10.6)),prog(t,15.7,16)*(1-prog(t,16.2,16.6)),prog(t,18.6,19)*(1-prog(t,19.3,19.8)));
  snow(t,wind,t>10&&t<16?.4:.8);
  streaks(t,wind);

  // A text
  const aO=1-prog(t,4.4,4.9);
  txt("LÀ-HAUT,",110,430,120,prog(t,.8,1.5),{out:aO});
  txt("LE FROID NE",110,560,120,prog(t,1.9,2.6),{out:aO});
  txt("PARDONNE PAS.",110,690,120,prog(t,2.3,3.0),{out:aO});
  // B text
  const bO=1-prog(t,9.5,9.9);
  tag("NOUVEAUTÉ",110,330,36,prog(t,6.0,6.5),ORANGE,"#fff",bO);
  txt("VESTE",110,520,140,prog(t,6.3,6.9),{out:bO});
  txt(CONFIG.product,110,640,96,prog(t,6.6,7.2),{out:bO,color:ORANGE,maxW:760});
  txt("Conçue pour la haute montagne.",114,720,38,prog(t,7.3,7.9),{weight:600,family:"Txt",style:"normal",out:bO});
  // C text
  const cO=1-prog(t,15.5,15.9);
  txt("IMPERMÉABLE.",110,250,130,prog(t,10.7,11.3),{out:cO});
  txt("La pluie glisse. Tu restes au sec.",114,320,38,prog(t,11.3,11.9),{weight:600,family:"Txt",style:"normal",out:cO});
  let cx=110;
  CONFIG.atouts.forEach((a,i)=>{const w=tag(a,cx,370,30,prog(t,12.4+i*.7,12.9+i*.7),i%2?"#fff":ORANGE,i%2?BLUE:"#fff",cO);cx+=(w||0)+22;
    if(!w){ctx.save();ctx.font="italic 900 30px Disp";cx+=ctx.measureText(a).width+33+22;ctx.restore()}});
  // D text
  const dO=1-prog(t,18.7,19.0);
  txt("FAITE",110,390,150,prog(t,16.4,17.0),{out:dO});
  txt("POUR LES",110,550,150,prog(t,16.7,17.3),{out:dO});
  txt("SOMMETS.",110,710,150,prog(t,17.0,17.6),{out:dO,color:ORANGE});

  // corner mark
  const ca=prog(t,.6,1.4)*(1-prog(t,18.8,19.2));
  if(ca>0){ctx.save();ctx.globalAlpha=ca*.9;ctx.drawImage(logoA,W-150,56,84,84*logoA.height/logoA.width);ctx.restore()}
  endCard(t);

  // flashes on cuts
  for(const c of [5,10,16]){const f=(t>=c?1-prog(t,c,c+.4):0)*.7;
    if(f>0){ctx.fillStyle=`rgba(255,255,255,${f})`;ctx.fillRect(0,0,W,H)}}
  const fi=1-prog(t,0,.6),fo=prog(t,22.3,23);
  if(fi>0||fo>0){ctx.fillStyle=`rgba(0,0,0,${Math.max(fi,fo)})`;ctx.fillRect(0,0,W,H)}
  const v=ctx.createRadialGradient(W/2,H/2,600,W/2,H/2,1250);
  v.addColorStop(0,"rgba(0,0,0,0)");v.addColorStop(1,"rgba(0,0,0,.35)");ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
}
window.render=render;window.T=T;
window.ready=Promise.all([document.fonts.load("italic 900 50px Disp"),document.fonts.load("600 50px Txt"),document.fonts.load("500 50px Txt"),
  ...[P.dos,P.face,P.detail,P.fond,P.sommets,V.face,V.dos,logo,logoA].map(im=>new Promise(r=>{if(im.complete)r();else im.onload=r}))]);
</script>
</body></html>
